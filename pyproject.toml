[project]
name = "agent-board"
version = "0.1.0"
description = "Shared task board, message log and file locks for coding agents, over MCP."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Collin Phipps" }]
keywords = ["mcp", "ai-agents", "multi-agent", "claude-code", "codex"]
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3", "uvicorn>=0.30"]

[project.urls]
Repository = "https://github.com/CollinPhipps/agent-board"

[project.scripts]
agent-board = "agent_board.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_board"]

[tool.pytest.ini_options]
testpaths = ["tests"]
